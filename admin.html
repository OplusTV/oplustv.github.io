<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060e17">
<link rel="manifest" href="admin.webmanifest">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="O-PLUS Admin">
<title>Admin · O-PLUS TV</title><meta name="robots" content="noindex">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060e17;--panel:#0d1c2e;--p2:#112540;--line:#1d3550;--cyan:#1fc8d6;--mag:#c2347f;--txt:#eaf2f8;--mut:#8da5ba;color-scheme:dark}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:radial-gradient(800px 400px at 5% -10%,rgba(31,200,214,.14),transparent 60%),var(--bg);color:var(--txt);font:400 15px/1.5 Poppins,system-ui,sans-serif;min-height:100vh}
input,button{font:inherit;color:inherit}button{cursor:pointer}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
input:focus{border-color:var(--cyan);outline:0}
.btn{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:500}
.btn:hover{border-color:var(--cyan)}.btn.main{background:linear-gradient(135deg,var(--mag),#8f2a9e);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
#login{max-width:380px;margin:12vh auto 0}#login h1{font-size:22px;margin-bottom:14px}#login label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}#login .btn{width:100%;margin-top:16px}
a.btn{text-decoration:none;color:inherit;display:inline-block}html{overscroll-behavior:none}
.err{color:#ff8a9b}.ok{color:var(--cyan)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,14,23,.92);backdrop-filter:blur(10px);z-index:5}
header h1{font-size:18px;margin-right:auto}header small{color:var(--mut)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input{max-width:280px;border-radius:999px;margin-left:auto}
#msg{min-height:24px;margin-bottom:10px}
.row{display:grid;grid-template-columns:34px 1.2fr 1fr 2.2fr auto;gap:8px 10px;align-items:end;margin-bottom:10px}
.row label{font-size:12px;color:var(--mut);display:block}.row .n{color:var(--mut);padding-bottom:10px;text-align:right}
.row .more.k{grid-template-columns:auto auto 1fr}.row .more{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.act{display:flex;gap:4px;align-items:center}.act .btn{padding:6px 10px}.live{display:flex;gap:6px;align-items:center;padding-bottom:8px;white-space:nowrap}.live input{width:auto}
details{margin-bottom:14px}summary{cursor:pointer;color:var(--cyan)}textarea{width:100%;height:110px;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--txt)}
.row .more.l{grid-template-columns:44px 1fr}.row .more.f{grid-template-columns:1fr 1fr 1fr}.row .more.t{grid-template-columns:1fr}
.row textarea{height:70px;margin:0;resize:vertical}.thumb{width:44px;height:44px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.08)}
@media(max-width:800px){.row .more.f,.row .more.k{grid-template-columns:1fr}.row{grid-template-columns:1fr}.row .more{grid-column:1;grid-template-columns:1fr}.row .n{text-align:left;padding:0}}
</style></head><body>
<form id="login" class="card">
  <h1>Panel de administración</h1>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
  <p id="le" class="err" style="margin-top:10px"></p>
  <button class="btn main">Entrar</button>
</form>
<div id="app" hidden>
  <header><h1>O-PLUS TV · Canales</h1><small id="who"></small><a class="btn" href="./" target="_blank" rel="noopener">Ver página</a><button class="btn" id="inst" hidden>Instalar app</button><button class="btn" id="out">Salir</button><button class="btn main" id="save">Guardar cambios</button></header>
  <div class="wrap">
    <div class="tools"><button class="btn" id="add">+ Agregar canal</button><small id="cnt" style="color:var(--mut);align-self:center"></small><button class="btn" id="bk" title="Descarga todos los canales como archivo .json">Descargar copia</button><label class="btn" for="rs" title="Reemplaza la lista por una copia descargada antes">Restaurar copia</label><input id="rs" type="file" accept=".json,application/json" hidden><input id="flt" type="search" placeholder="Filtrar por nombre o categoría"></div>
    <details><summary>Importar lista M3U</summary><textarea id="m3u" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;Noticias&quot;,Canal&#10;https://..."></textarea><button class="btn" id="imp">Agregar a la lista</button></details>
    <p id="msg"></p><div id="rows"></div><datalist id="cats"></datalist>
  </div>
</div>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id),app=initializeApp(FB),auth=getAuth(app),ref=doc(getFirestore(app),"config","channels");
let ch=[],dirty=false;
const msg=(t,e)=>{$("msg").textContent=t;$("msg").className=e?"err":"ok"};
const mark=()=>{dirty=true;$("save").textContent="Guardar cambios *"};
addEventListener("beforeunload",e=>{if(dirty)e.preventDefault()});
$("login").onsubmit=async e=>{e.preventDefault();$("le").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)}catch{$("le").textContent="Correo o contraseña incorrectos."}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $("login").hidden=!!u;$("app").hidden=!u;if(!u)return;$("who").textContent=u.email;
  try{const s=await getDoc(ref);ch=s.exists()?(s.data().list||[]):[]}catch(e){msg("No se pudo leer la lista ("+e.code+").",1)}
  render();
});
function fld(label,key,i,ph,list){
  const l=document.createElement("label"),x=document.createElement("input");l.append(label);x.value=ch[i][key]||"";x.placeholder=ph||"";if(list)x.setAttribute("list",list);
  x.oninput=()=>{ch[i][key]=x.value;mark()};l.append(x);return l;
}
function tfld(label,key,i,ph){
  const l=document.createElement("label"),x=document.createElement("textarea");l.append(label);x.value=ch[i][key]||"";x.placeholder=ph||"";
  x.oninput=()=>{ch[i][key]=x.value;mark()};l.append(x);return l;
}
const nz=s=>(s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
const xt=s=>{const m=/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-]\d{4})?/.exec((s||"").trim());if(!m)return NaN;let t=Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));if(m[7]){const o=parseInt(m[7].slice(1,3))*60+parseInt(m[7].slice(3));t-=(m[7][0]==="-"?-1:1)*o*60000}return t};
async function probar(c){
  const u=(c.e||"").trim();
  if(!/^https?:\/\/.+\.xml(\.gz)?(\?|#|$)/i.test(u))return alert("Primero escribe en el campo de la guía la URL del epg.xml (debe terminar en .xml o .xml.gz).");
  const gz=/\.gz(\?|#|$)/i.test(u);let txt=null,via="";
  for(const [t,n] of [[u,"directo"],["https://corsproxy.io/?url="+encodeURIComponent(u),"corsproxy.io"],["https://api.allorigins.win/raw?url="+encodeURIComponent(u),"allorigins"]]){
    try{const r=await fetch(t);if(!r.ok)continue;const b=await r.blob();txt=gz&&window.DecompressionStream?await new Response(b.stream().pipeThrough(new DecompressionStream("gzip"))).text():await b.text();via=n;break}catch{}
  }
  if(!txt)return alert("No se pudo descargar la guía desde el navegador: el servidor no permite CORS y los servicios intermedios también fallaron.");
  const d=new DOMParser().parseFromString(txt,"text/xml");
  if(d.querySelector("parsererror")||!d.querySelector("tv"))return alert("Se descargó, pero no es un XMLTV válido.");
  const ids=[...d.querySelectorAll("channel")].map(x=>x.getAttribute("id")),id=nz(c.id||c.n);
  const ps=[...d.querySelectorAll("programme")].filter(p=>nz(p.getAttribute("channel"))===id).map(p=>({s:xt(p.getAttribute("start")),e:xt(p.getAttribute("stop")),t:p.querySelector("title")?.textContent.trim()})).filter(p=>!isNaN(p.s)&&!isNaN(p.e)).sort((a,b)=>a.s-b.s);
  const f=t=>new Date(t).toLocaleString(),L=["Descarga: "+via+(via!=="directo"?" (el servidor no permite CORS directo)":""),"Canales en el archivo: "+ids.slice(0,8).join(", ")+(ids.length>8?"…":"")];
  if(!ps.length)return alert(L.concat(["","PROBLEMA: no hay programas para el ID «"+(c.id||c.n)+"». Pon en «ID de la guía» uno de los canales de arriba."]).join("\n"));
  const now=Date.now(),cur=ps.find(p=>now>=p.s&&now<p.e),last=ps[ps.length-1].e;
  L.push("Programas de este canal: "+ps.length,"Desde "+f(ps[0].s)+" hasta "+f(last),"");
  if(cur)L.push("OK: ahora está «"+cur.t+"».");
  else if(last<now)L.push("La guía está desactualizada. "+(c.loop?"Con «Guía repetida cada día» activado, la página la desplaza a hoy.":"Si el archivo repite siempre el mismo día, activa «Guía repetida cada día»."));
  else L.push("La guía no tiene un programa para este momento (hay un hueco).");
  alert(L.join("\n"));
}
function btn(t,fn,title){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent=t;b.title=title||"";b.onclick=fn;return b}
function render(){
  const q=$("flt").value.trim().toLowerCase(),box=$("rows");box.textContent="";$("cnt").textContent=ch.length+" canales";
  $("cats").innerHTML="";[...new Set(ch.map(c=>c.c).filter(Boolean))].forEach(c=>$("cats").append(new Option(c)));
  ch.forEach((c,i)=>{
    if(q&&!((c.n||"")+" "+(c.c||"")).toLowerCase().includes(q))return;
    const r=document.createElement("div"),n=document.createElement("div"),m=document.createElement("div"),a=document.createElement("div"),lv=document.createElement("label"),cb=document.createElement("input");
    r.className="card row";r.style.padding="14px";n.className="n";n.textContent=i+1;m.className="more";a.className="act";lv.className="live";
    cb.type="checkbox";cb.checked=!!c.live;cb.onchange=()=>{c.live=cb.checked?1:0;mark()};lv.append(cb,"En vivo");
    const mv=d=>()=>{const j=i+d;if(j<0||j>=ch.length)return;[ch[i],ch[j]]=[ch[j],ch[i]];mark();render()};
    a.append(btn("↑",mv(-1),"Subir"),btn("↓",mv(1),"Bajar"),btn("⧉",()=>{ch.splice(i+1,0,{...c,n:(c.n||"")+" (copia)"});mark();render()},"Duplicar"),btn("✕",()=>{if(confirm("¿Borrar «"+(c.n||"sin nombre")+"»?")){ch.splice(i,1);mark();render()}},"Borrar"));
    m.append(fld("Guía: URL del epg.xml (XMLTV), o del stream .ts para leer su guía integrada","e",i,"https://.../epg.xml"),fld("ID de la guía (tvg-id, opcional)","id",i,""),lv);
    r.append(n,fld("Nombre","n",i,"Mi canal"),fld("Categoría","c",i,"Noticias","cats"),fld("URL del canal (.m3u8 o http://ip:puerto/play/id)","u",i,"https://..."),a,document.createElement("span"),m);
    const mk=cls=>{const d=document.createElement("div");d.className="more "+cls;return d},m2=mk("l"),m3=mk("f"),m4=mk("t"),m5=mk("k"),th=document.createElement("img"),lg=fld("Logo (URL de imagen o ruta como logos/canal.png)","img",i,"https://.../logo.png");
    th.className="thumb";th.alt="";const sh=()=>{th.style.visibility=c.img?"visible":"hidden";if(c.img)th.src=c.img};sh();th.onerror=()=>{th.style.visibility="hidden"};lg.querySelector("input").addEventListener("input",sh);
    m2.append(th,lg);m3.append(fld("Público (ej: familiar, adultos, niños)","pub",i,""),fld("Idioma","lang",i,"Español"),fld("País","country",i,""));
    m4.append(tfld("Descripción: de qué trata el canal","desc",i,"Canal de noticias las 24 horas..."));
    const lp=document.createElement("label"),cb2=document.createElement("input");
    lp.className="live";cb2.type="checkbox";cb2.checked=!!c.loop;cb2.onchange=()=>{c.loop=cb2.checked?1:0;mark()};lp.append(cb2,"Guía repetida cada día (el .xml siempre trae el mismo día)");
    m5.append(lp,btn("Probar guía",()=>probar(c),"Descarga el epg.xml y comprueba que funcione"));
    r.append(m5,m2,m3,m4);
    box.append(r);
  });
  if(!box.childElementCount)box.innerHTML='<p class="card" style="color:var(--mut);text-align:center">No hay canales. Agrega uno o importa una lista M3U.</p>';
}
$("flt").oninput=render;
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&!$("app").hidden){e.preventDefault();$("save").click()}});
$("bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(ch,null,1)],{type:"application/json"}));a.download="oplus-canales-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("rs").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j))throw 0;if(!confirm("Esto reemplaza la lista actual ("+ch.length+" canales) por la copia ("+j.length+"). ¿Continuar?"))return;ch=j.map(c=>({...c}));mark();render();msg("Copia cargada (todavía sin guardar).")}
  catch{msg("El archivo no es una copia válida.",1)}};
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("inst").hidden=false});
addEventListener("appinstalled",()=>{$("inst").hidden=true});
$("inst").onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$("inst").hidden=true};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
$("add").onclick=()=>{ch.unshift({n:"",c:"Mis canales",u:"",live:1});$("flt").value="";mark();render()};
$("imp").onclick=()=>{
  const out=[];let meta=null;
  for(const raw of $("m3u").value.split(/\r?\n/)){const l=raw.trim();
    if(l.startsWith("#EXTINF")){const g=/group-title="([^"]*)"/.exec(l),d=/tvg-id="([^"]*)"/.exec(l),lg=/tvg-logo="([^"]*)"/.exec(l);meta={id:d&&d[1]||"",img:lg&&lg[1]||"",n:l.slice(l.lastIndexOf(",")+1).trim()||"Canal",c:g&&g[1]||"Mis canales"}}
    else if(/^https?:\/\//i.test(l)){out.push({id:meta?meta.id:"",n:meta?meta.n:"Canal "+(out.length+1),c:meta?meta.c:"Mis canales",u:l,live:1,img:meta?meta.img:""});meta=null}}
  const have=new Set(ch.map(c=>c.u)),add=out.filter(c=>!have.has(c.u));
  ch=ch.concat(add);$("m3u").value="";mark();render();msg(add.length+" canales agregados (sin guardar todavía).");
};
$("save").onclick=async()=>{
  const bad=ch.findIndex(c=>!(c.n||"").trim()||!/^https?:\/\//i.test((c.u||"").trim()));
  if(bad>=0)return msg("El canal #"+(bad+1)+" necesita nombre y una URL que empiece con http:// o https://.",1);
  const list=ch.map(c=>{const o={n:c.n.trim(),c:(c.c||"Mis canales").trim()||"Mis canales",u:c.u.trim()};if(c.live)o.live=1;if(c.loop)o.loop=1;if((c.id||"").trim())o.id=c.id.trim();if((c.e||"").trim())o.e=c.e.trim();["img","desc","pub","lang","country"].forEach(k=>{if((c[k]||"").trim())o[k]=c[k].trim()});return o});
  if(new Blob([JSON.stringify(list)]).size>900000)return msg("La lista es demasiado grande para Firestore (límite 1 MiB). Usa URLs de logo en lugar de imágenes incrustadas y descripciones más cortas.",1);
  try{await setDoc(ref,{list,updated:Date.now()});ch=list;dirty=false;$("save").textContent="Guardar cambios";msg("Guardado. La página principal ya muestra los cambios.");render()}
  catch(e){msg("No se pudo guardar ("+e.code+"). Revisa que tu UID esté en las reglas de Firestore.",1)}
};
</script></body></html>
