name: Transmitir En Vivo (RTMP Privado)

on:
  workflow_dispatch:

jobs:
  transmitir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Iniciar transmisión a servidor privado
        env:
          RTMP_TARGET: ${{ secrets.RTMP_TARGET }}
        run: |
          # Busca automáticamente cualquier archivo .mp4 ignorando mayúsculas/minúsculas
          VIDEO=$(find . -maxdepth 1 -iname "*.mp4" | head -n 1)
          
          echo "Video encontrado: $VIDEO"
          
          if [ -z "$VIDEO" ]; then
            echo "ERROR: No se encontró ningún archivo .mp4 en la raíz del repositorio."
            ls -la
            exit 1
          fi
          
          echo "Iniciando transmisión hacia SSH101..."
          ffmpeg -re -stream_loop -1 -i "$VIDEO" -c:v copy -c:a aac -f flv "$RTMP_TARGET"
