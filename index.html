<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060e17">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="O-PLUS TV">
<title>O-PLUS TV</title>
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Bibliotecas de HLS y Plyr integradas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<style>
:root{--bg:#060e17;--panel:#0d1c2e;--panel2:#112540;--line:#1d3550;--navy:#163959;--cyan:#1fc8d6;--mag:#c2347f;--txt:#eaf2f8;--mut:#8da5ba;color-scheme:dark;--plyr-color-main:var(--cyan)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 5% -10%,rgba(31,200,214,.15),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(194,52,127,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);font:400 15px/1.5 Poppins,system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(6,14,23,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand svg{width:34px;height:34px}
.brand sup{font-size:11px;font-weight:600;margin-left:2px;color:var(--cyan)}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 40px}
.search input:focus{border-color:var(--cyan);outline:0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.main{background:linear-gradient(135deg,var(--mag),#8f2a9e);border-color:transparent}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:20px 24px}
.stage{overflow:auto;padding:2px}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 90px rgba(31,200,214,.08)}
video{width:100%;height:100%;display:block;background:#000}
.plyr{width:100%;height:100%;border-radius:20px}
.screen.hide-controls .plyr__controls,.screen.hide-controls .plyr__control--overlaid{display:none!important;opacity:0!important;pointer-events:none;visibility:hidden!important}
.over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(6,14,23,.86);backdrop-filter:blur(6px);padding:20px;z-index:10}
.over p{white-space:pre-line;max-width:520px;color:var(--mut);margin-top:6px}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--cyan);border-right-color:var(--mag);animation:r 1s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes p{50%{opacity:.25}}
.info{display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:center;margin-top:18px}
.titles{display:flex;align-items:center;gap:14px;min-width:0}
.clogo{width:58px;height:58px;border-radius:14px;object-fit:contain;background:rgba(255,255,255,.08);padding:4px;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:rgba(255,255,255,.1);padding:3px}
.about{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.about .d{font-size:14px;white-space:pre-line}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.about .d+.facts{margin-top:10px}
.fact{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--mut)}
.fact b{color:var(--txt);font-weight:500}
.info h1{font-size:26px;font-weight:600;line-height:1.2}
.tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--mut)}
.tag:empty{display:none}
.tag.live{display:inline-flex;align-items:center;gap:6px;border-color:transparent;background:var(--mag);color:#fff;font-weight:600;letter-spacing:.4px}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.nowbox{grid-column:1/-1;background:linear-gradient(180deg,var(--panel),rgba(13,28,46,.55));border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:14px;padding:12px 16px}
.nowbox .t{font-weight:600}.nowbox .m{color:var(--mut);font-size:13px}.nowbox p{margin-top:4px;color:var(--mut);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag))}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
aside{background:rgba(13,28,46,.75);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden;backdrop-filter:blur(10px)}
.chips{display:flex;gap:8px;padding:14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.chip{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--mut);font-size:13px;transition:.15s}
.chip:hover{color:var(--txt);border-color:var(--cyan)}
.chip[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#052028;font-weight:600}
#list{list-style:none;padding:8px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#list li+li{margin-top:2px}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:14px;padding:9px 10px;transition:.15s}
.ch:hover{background:rgba(255,255,255,.05)}
.ch[aria-current=true]{background:linear-gradient(90deg,rgba(31,200,214,.17),rgba(31,200,214,.03));border-color:rgba(31,200,214,.55)}
.num{width:24px;text-align:right;color:var(--mut);font-size:12px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{background:none;border:0;font-size:20px;color:var(--mut);padding:4px;transition:.15s}
.fav:hover{transform:scale(1.2)}
.fav[aria-pressed=true]{color:var(--mag)}
.empty{padding:28px;color:var(--mut);text-align:center}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(540px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6);margin:auto}
dialog::backdrop{background:rgba(3,8,14,.7);backdrop-filter:blur(4px)}
dialog h2{font-size:20px;margin-bottom:10px}
dialog label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
dialog input:focus,dialog textarea:focus{border-color:var(--cyan);outline:0}
dialog textarea{height:110px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
#gdlg{width:min(1060px,96vw);max-height:94vh;overflow:auto}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.gtools input[type=file]{width:auto;background:none;border:0;padding:0}
.gtools input[type=url]{flex:1;min-width:200px;width:auto;border-radius:999px}
.g{overflow:auto;max-height:40vh;border:1px solid var(--line);border-radius:14px}
.gw{position:relative;width:max-content;min-width:100%}
.gr{display:flex;border-bottom:1px solid var(--line);height:46px}
.gl{position:sticky;left:0;z-index:3;width:150px;flex:none;background:var(--panel);border:0;border-right:1px solid var(--line);border-radius:0;padding:0 10px;text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative;flex:none}
.pb{position:absolute;top:4px;bottom:4px;background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:0 8px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.pb.on{border-color:var(--cyan);background:#1b4a6b}.pb:hover{border-color:var(--mag)}
.gh{height:30px;position:sticky;top:0;z-index:4;background:var(--panel)}
.gh .gt span{position:absolute;top:4px;font-size:12px;color:var(--mut);border-left:1px solid var(--line);padding-left:6px}
.nl{position:absolute;top:0;bottom:0;width:2px;background:var(--mag);z-index:2;pointer-events:none}
#gd{margin-top:10px;min-height:54px}#gd strong{color:var(--txt)}#gd .btn{margin-top:6px}
@media(max-width:900px){
html,body{height:auto}
body{display:block;min-height:100%;overflow-x:hidden}
header{flex-wrap:wrap;gap:8px;padding:10px 12px}
.brand{font-size:18px;margin-right:auto}.brand svg{width:30px;height:30px}
header .btn{padding:7px 12px;font-size:14px}
.search{order:3;flex-basis:100%;max-width:none;margin:0}
main{display:flex;flex-direction:column;gap:12px;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.stage{display:contents}
.screen{position:sticky;top:0;z-index:30;flex:none;margin:0 -12px;border-radius:0;border-width:0 0 1px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.plyr{border-radius:0}
.info{grid-template-columns:1fr;gap:10px;margin-top:0}
.info h1{font-size:20px}.clogo{width:46px;height:46px}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl select{grid-column:1/-1;width:100%}
.ctl .btn{justify-content:center;padding:9px 6px;font-size:14px}
#fs,.stage>.hint{display:none}
.nowbox,.about{padding:10px 14px}
aside{display:block;overflow:visible;backdrop-filter:none;border-radius:16px}
.chips{padding:12px}
#list{overflow:visible;padding:6px 6px 10px}
.ch{padding:10px 8px}.logo{width:48px;height:48px}.num{display:none}.fav{padding:8px 10px}
dialog{width:94vw;padding:18px}
#gdlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0;padding:14px}
.gl{width:104px;font-size:13px}.g{max-height:55vh}
}
@media(max-width:900px) and (orientation:landscape) and (max-height:520px){.screen{position:relative;margin:0;border-width:1px}}
@media(prefers-reduced-motion:reduce){.spin,.tag.live::before{animation-duration:3s}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M10 50A40 40 0 0 1 80 20" fill="none" stroke="#1fc8d6" stroke-width="6"/><path d="M86 28A40 40 0 0 1 20 82" fill="none" stroke="#b03174" stroke-width="6"/><circle cx="50" cy="50" r="31" fill="#163959"/><path fill-rule="evenodd" fill="#fff" d="M50 29a21 21 0 1 0 0 42a21 21 0 1 0 0-42zM46 38h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/></svg>
    <span>O-PLUS<sup>TV</sup></span>
  </div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar canal" aria-label="Buscar canal"></label>
  <button class="btn" id="inst" hidden>Instalar app</button>
  <button class="btn" id="gbtn">Guía</button>
</header>
<main>
  <section class="stage">
    <div class="screen">
      <video id="v" controls playsinline autoplay></video>
      <div class="over" id="ov"><div><div class="spin"></div><strong id="ovt">Cargando señal</strong><p id="ovp"></p><button class="btn" id="retry" hidden style="margin-top:14px">Reintentar</button></div></div>
    </div>
    <div class="info">
      <div class="titles"><img id="clogo" class="clogo" alt="" hidden><div><h1 id="title">O-PLUS TV</h1><div class="tags"><span class="tag" id="cat"></span><span class="tag live" id="live" hidden>EN VIVO</span></div></div></div>
      <div class="ctl">
        <select id="qual" aria-label="Calidad"><option value="-1">Calidad: Auto</option></select>
        <button class="btn" id="prev" title="Canal anterior (↑)">‹ Anterior</button>
        <button class="btn" id="next" title="Canal siguiente (↓)">Siguiente ›</button>
        <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
        <button class="btn" id="share" title="Copiar enlace a este canal">Compartir</button>
      </div>
      <div class="nowbox" id="nowbox" hidden></div>
      <div class="about" id="about" hidden></div>
    </div>
    <p class="hint">Atajos: ↑ ↓ cambian de canal · F pantalla completa · G guía · M silencio · / buscar</p>
  </section>
  <aside>
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
    <ul id="list"></ul>
  </aside>
</main>

<dialog id="gdlg">
  <h2>Guía de programación</h2>
  <div class="gtools"><span class="hint" id="gs"></span></div>
  <div class="g" id="g"></div>
  <div id="gd" class="hint">Toca un programa para ver el detalle.</div>
  <div class="row"><button class="btn" id="gx">Cerrar</button></div>
</dialog>

<script src="firebase-config.js"></script>
<script>
// ---- Canales de respaldo (se usan solo si Firebase no está configurado); los reales vienen de Firestore ----
// ---- Canales de prueba ----
let CHANNELS=[
 {id:"bbb",n:"Big Buck Bunny",c:"Cine",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {id:"sintel",n:"Sintel",c:"Cine",u:"https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"},
 {id:"tos",n:"Tears of Steel",c:"Cine",u:"https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8"},
 {id:"nasa",n:"NASA TV",c:"Ciencia",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",live:1},
 {id:"redbull",n:"Red Bull TV",c:"Deportes",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",live:1},
 {id:"akamai",n:"Akamai Live Test",c:"Pruebas",u:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",live:1},
 {id:"bipbop",n:"Apple BipBop",c:"Pruebas",u:"https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"},
 {id:"mux",n:"Mux Demo",c:"Pruebas",u:"https://stream.mux.com/v69RSHhFelSm4701snP22dYz2jICy4E4FUyk02rW4gxRM.m3u8"}
];
const $=id=>document.getElementById(id), dlog=[];
// ---- Canales desde Firebase (Firestore: config/channels) ----
let remoteOk=false;
async function loadRemote(){
  if(!window.FB||!FB.apiKey||FB.apiKey.startsWith("PEGA"))return;
  try{
    const V="https://www.gstatic.com/firebasejs/10.12.2/";
    const [{initializeApp},{getFirestore,doc,getDoc}]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js")]);
    const s=await getDoc(doc(getFirestore(initializeApp(FB)),"config","channels"));
    remoteOk=true;
    if(s.exists()&&Array.isArray(s.data().list)){CHANNELS=s.data().list;try{localStorage.setItem("op_cache",JSON.stringify(CHANNELS))}catch{}}
    else CHANNELS=[];
  }catch(e){try{const c=JSON.parse(localStorage.getItem("op_cache"));if(c){CHANNELS=c;remoteOk=true}}catch{}}
}

// Inicialización de Plyr
const player = new Plyr('#v', {
  controls: ['play-large', 'play', 'mute', 'volume', 'fullscreen'],
  keyboard: { global: false } // Evita conflicto con los atajos personalizados ya existentes
});
// La lógica interactúa directamente con el elemento nativo mantenido por Plyr
const v = $("v");

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch{}}};
const mine=[]; let favs=store.get("op_favs",[]), cat="Todos", cur=-1, hls=null, filtered=[];
const all=()=>CHANNELS.concat(mine);
const okColor=x=>/^#[0-9a-f]{3,8}$/i.test(x||"")?x:"";
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const cats=()=>["Todos","Favoritos",...new Set(all().map(c=>c.c))];

function logoImg(l,c){
  if(!c.img)return;
  const im=new Image();im.alt="";im.loading="lazy";im.src=c.img;
  im.onerror=()=>im.remove();l.textContent="";l.append(im);
  im.onerror=()=>{im.remove();l.textContent=c.n.slice(0,2).toUpperCase()};
}
function chanInfo(c){
  const im=$("clogo"),ab=$("about");
  im.hidden=!c.img;if(c.img){im.onerror=()=>{im.hidden=true};im.src=c.img}
  ab.textContent="";
  const facts=[["Público",c.pub],["Idioma",c.lang],["País",c.country]].filter(x=>x[1]);
  if(!c.desc&&!facts.length){ab.hidden=true;return}
  ab.hidden=false;
  if(c.desc)ab.append(mk("p","d",c.desc));
  if(facts.length){const f=mk("div","facts");facts.forEach(([k,v])=>{const sp=mk("span","fact");sp.append(mk("b",null,k+": "),v);f.append(sp)});ab.append(f)}
}
function drawChips(){const b=$("chips");b.textContent="";cats().forEach(c=>{const e=document.createElement("button");e.className="chip";e.textContent=c;e.setAttribute("aria-pressed",c===cat);e.onclick=()=>{cat=c;drawChips();drawList()};b.append(e)})}
function drawList(){
  const q=$("q").value.trim().toLowerCase(), ul=$("list"); ul.textContent="";
  filtered=all().filter(c=>(cat==="Todos"||(cat==="Favoritos"?favs.includes(c.u):c.c===cat))&&c.n.toLowerCase().includes(q));
  if(!filtered.length){ul.innerHTML='<li class="empty">No hay canales aquí todavía.</li>';return}
  filtered.forEach((c,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.className="ch";b.setAttribute("aria-current",c.u===(all()[cur]||{}).u);
    const n=document.createElement("span");n.className="num";n.textContent=all().indexOf(c)+1;
    const l=document.createElement("span");l.className="logo";l.textContent=c.n.slice(0,2).toUpperCase();l.style.background=okColor(c.color)||"linear-gradient(135deg,#1b4a6b,#163959)";logoImg(l,c);
    const t=document.createElement("span");t.className="nm";t.innerHTML="<b></b><small></small><div class=bar><i></i></div>";t.firstChild.textContent=c.n;t.dataset.i=all().indexOf(c);fillProg(t,c);
    const f=document.createElement("button");f.className="fav";f.textContent="♥";f.title="Favorito";f.setAttribute("aria-label","Favorito");f.setAttribute("aria-pressed",favs.includes(c.u));
    f.onclick=e=>{e.stopPropagation();favs=favs.includes(c.u)?favs.filter(x=>x!==c.u):[...favs,c.u];store.set("op_favs",favs);drawList()};
    b.append(n,l,t,f);b.onclick=()=>play(all().indexOf(c));li.append(b);ul.append(li)});
}
function overlay(show,title,msg){$("ov").hidden=!show;document.querySelector('.screen').classList.toggle('hide-controls',show);if(show){$("ovt").textContent=title;$("ovp").textContent=(msg||"")+(title.startsWith("No se pudo")&&dlog.length?"\n\nDiagnóstico:\n"+dlog.join("\n"):"");$("ov").querySelector(".spin").style.display=title.startsWith("Cargando")?"":"none";$("retry").hidden=!title.startsWith("No se pudo")}}
function destroy(){if(hls){hls.destroy();hls=null}if(mp){try{mp.destroy()}catch{}mp=null}if(eitCtl){eitCtl.abort();eitCtl=null}v.onerror=null;v.removeAttribute("src");v.load();const q=$("qual");q.length=1;q.value="-1"}

function play(i){
  const list=all(); if(!list.length)return; cur=(i+list.length)%list.length; const c=list[cur];

  const fail=m=>overlay(true,"No se pudo reproducir",m||"La señal no responde o el servidor no permite reproducirla desde esta página. Prueba con otro canal.");

function startHls(c,fail){
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30,enableWorker:true});
    hls.loadSource(c.u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{
      const q=$("qual");d.levels.forEach((l,k)=>{const o=new Option((l.height?l.height+"p":Math.round(l.bitrate/1000)+" kbps"),k);q.add(o)});
      v.play().catch(()=>overlay(true,"Toca para reproducir","Tu navegador pide una acción antes de iniciar el video."));
    });
    let tries=0;
    hls.on(Hls.Events.ERROR,(_,e)=>{
      if(!e.fatal)return;
      if(e.type===Hls.ErrorTypes.NETWORK_ERROR&&tries++<2){overlay(true,"Cargando señal","Reconectando…");hls.startLoad()}
      else if(e.type===Hls.ErrorTypes.MEDIA_ERROR&&tries++<2){hls.recoverMediaError()}

    });

    v.src=c.u; v.onerror=()=>fail(); v.play().catch(()=>{});
  }else fail("Este navegador no soporta HLS.");
}

document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)||document.querySelector("dialog[open]"))return;
  if(e.key==="ArrowUp"){e.preventDefault();play(cur-1)}
  else if(e.key==="ArrowDown"){e.preventDefault();play(cur+1)}

function applyEit(c,out,tok){

}
async function readEit(c,tok){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000),out=new Map();eitCtl=ctl;
  let rest=new Uint8Array(0),cur=null,last=0;
  const done=a=>parseEit(Uint8Array.from(a),out);
  const sec=(p,pusi)=>{
    let pos=0;
    if(pusi){
      const ptr=p[0];
      if(cur){for(let i=1;i<=ptr&&cur.a.length<cur.n;i++)cur.a.push(p[i]);if(cur.a.length>=cur.n)done(cur.a);cur=null}
      pos=1+ptr;
    }else{
      if(cur){for(let i=0;i<p.length&&cur.a.length<cur.n;i++)cur.a.push(p[i]);if(cur.a.length>=cur.n){done(cur.a);cur=null}}
      return;
    }
    while(pos+3<=p.length&&p[pos]!==0xFF){
      const n=((p[pos+1]&15)<<8|p[pos+2])+3,a=Array.from(p.subarray(pos,Math.min(pos+n,p.length)));
      if(a.length>=n){done(a);pos+=n}else{cur={a,n};break}
    }
  };
  try{
    const rd=(await fetch(eitUrl(c)||c.u,{signal:ctl.signal})).body.getReader();
    for(;;){
      const{value,done:fin}=await rd.read();if(fin)break;
      const b=new Uint8Array(rest.length+value.length);b.set(rest);b.set(value,rest.length);let o=0;
      while(b.length-o>=188){
        if(b[o]!==0x47||(o+188<b.length&&b[o+188]!==0x47)){let n=o+1;while(n+188<b.length&&!(b[n]===0x47&&b[n+188]===0x47))n++;o=n;if(n+188>=b.length)break;continue}
        if(((b[o+1]&0x1F)<<8|b[o+2])===0x12&&!(b[o+1]&0x80)){
          const af=(b[o+3]>>4)&3;let q=o+4;if(af&2)q+=1+b[o+4];
          if((af&1)&&q<o+188)sec(b.subarray(q,o+188),b[o+1]&0x40);
        }
        o+=188;
      }
      rest=b.slice(o);
      if(Date.now()-last>2000){last=Date.now();applyEit(c,out,tok)}
    }
  }catch{}
  clearTimeout(to);applyEit(c,out,tok);
}
